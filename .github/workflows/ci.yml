name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pipeline:
    name: test build deploy smoke
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install kind and kubectl
        run: |
          curl -fsSL -o /tmp/kind https://kind.sigs.k8s.io/dl/v0.33.0/kind-linux-amd64
          sudo install /tmp/kind /usr/local/bin/kind
          version="$(curl -fsSL https://dl.k8s.io/release/stable.txt)"
          curl -fsSL -o /tmp/kubectl "https://dl.k8s.io/release/${version}/bin/linux/amd64/kubectl"
          sudo install /tmp/kubectl /usr/local/bin/kubectl

      - name: Run pipeline
        run: ./scripts/ci-local.sh
