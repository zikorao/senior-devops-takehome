# Example only. scripts/deploy.sh creates app-credentials with generated
# passwords and does not write them into git.
apiVersion: v1
kind: Secret
metadata:
  name: app-credentials
  namespace: takehome
type: Opaque
stringData:
  RABBITMQ_USER: takehome
  RABBITMQ_PASSWORD: GENERATE_ME
  REDIS_PASSWORD: GENERATE_ME
  RABBITMQ_URL: amqp://takehome:GENERATE_ME@rabbitmq:5672/
  REDIS_URL: redis://:GENERATE_ME@redis:6379/0
