apiVersion: apps/v1
kind: Deployment
metadata:
  name: mock
  labels:
    app.kubernetes.io/name: mock
    app.kubernetes.io/part-of: takehome
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mock
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mock
        app.kubernetes.io/part-of: takehome
    spec:
      enableServiceLinks: false
      automountServiceAccountToken: false
      containers:
        - name: mock
          image: devops-takehome-mock:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8081
          envFrom:
            - configMapRef:
                name: app-config
          startupProbe:
            httpGet:
              path: /livez
              port: http
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /livez
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /livez
              port: http
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: mock
  labels:
    app.kubernetes.io/name: mock
    app.kubernetes.io/part-of: takehome
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: mock
  ports:
    - name: http
      port: 8081
      targetPort: http
