[build-system]
requires = ["setuptools>=75,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "devops-takehome"
version = "1.0.0"
description = "A small, instrumented asynchronous job application for a DevOps interview"
requires-python = ">=3.12,<3.13"
dependencies = [
  "aio-pika>=9.5,<10",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "prometheus-client>=0.21,<1",
  "pydantic-settings>=2.6,<3",
  "redis>=5.2,<7",
  "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9", "pytest-asyncio>=0.25,<1", "ruff>=0.11,<1", "PyYAML>=6,<7"]

[tool.setuptools.packages.find]
include = ["takehome*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = ["integration: requires running RabbitMQ, Redis, and mock HTTP dependencies"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]

[tool.ruff.lint.isort]
known-first-party = ["takehome"]
